[workspace]
members = ["crates/vigil-core", "crates/vigild", "crates/vigilctl"]
resolver = "3"

[workspace.package]
version = "0.6.1"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process", "signal", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

vigil-core = { path = "crates/vigil-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
