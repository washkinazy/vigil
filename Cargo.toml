[workspace]
members = ["crates/vigil-core", "crates/vigild", "crates/vigilctl"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
vigil-core = { path = "crates/vigil-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
