name: Check Vigil
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select required checks
        id: diff
        env:
          RELEASE_PR: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release-please--branches--main' && contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          build=true
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            args=("$BASE_SHA" "$HEAD_SHA")
            if [ "$RELEASE_PR" = true ]; then
              args+=(--release-pr)
            fi
            build=$(python3 scripts/release-only.py "${args[@]}")
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
  workflow-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test CI selection
        run: python3 scripts/test-ci-selection.py
      - name: Validate workflows
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
  check:
    needs: classify
    if: needs.classify.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: ['44', '45']
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - name: Install build tools
        run: dnf install -y git rust cargo rustfmt clippy gcc just rpm-build systemd-rpm-macros tar gzip shellcheck dbus-daemon
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: cargo fetch --locked
      - run: just check
      - run: cargo test -p vigild --locked --offline -- --ignored
      - run: shellcheck scripts/*.sh
      - name: Check package version
        run: python3 scripts/check-version.py
      - name: Build and test RPM from this checkout
        run: |
          mkdir -p "$RUNNER_TEMP/rpmbuild/SOURCES"
          version=$(cat VERSION)
          git -c safe.directory="$GITHUB_WORKSPACE" archive --format=tar.gz --prefix="vigil-$version/" HEAD > "$RUNNER_TEMP/rpmbuild/SOURCES/vigil-$version.tar.gz"
          rpmbuild -ba --define "_topdir $RUNNER_TEMP/rpmbuild" packaging/vigil.spec
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test release configuration in Fedora
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace registry.fedoraproject.org/fedora:45 bash -euc '
            dnf install -y nodejs npm python3 rpm-build systemd-rpm-macros
            npm install --prefix /tmp/release-tools --ignore-scripts --no-audit --no-fund release-please@17.6.0 ajv@8.17.1
            python3 scripts/check-version.py
            NODE_PATH=/tmp/release-tools/node_modules node scripts/test-release.cjs
          '
  ci:
    name: CI
    if: always()
    needs: [classify, workflow-validation, check, release-config]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks
        env:
          CLASSIFY: ${{ needs.classify.result }}
          WORKFLOWS: ${{ needs.workflow-validation.result }}
          RELEASE: ${{ needs.release-config.result }}
          BUILD_REQUIRED: ${{ needs.classify.outputs.build }}
          BUILD: ${{ needs.check.result }}
        run: |
          test "$CLASSIFY" = success
          test "$WORKFLOWS" = success
          test "$RELEASE" = success
          if [ "$BUILD_REQUIRED" = true ]; then
            test "$BUILD" = success
          else
            test "$BUILD_REQUIRED" = false
            test "$BUILD" = skipped
          fi
