[timeouts]
display_seconds = 900
lock_seconds = 1200
suspend_seconds = 1800
retry_seconds = 30

[activity]
# Reconcile logind inhibitors and Niri output geometry; activity uses event streams.
poll_seconds = 2
audio = true
recording = true
media = true
# Opt in to "geometry" on Niri: output-sized visible windows approximate fullscreen.
fullscreen = "disabled"
audio_scope = ["display", "lock", "suspend"]
recording_scope = ["display", "lock", "suspend"]
media_scope = ["display", "lock", "suspend"]

[commands]
lock_unit = "wm-lock.service"
lock_timeout_seconds = 10
display_off = ["niri", "msg", "action", "power-off-monitors"]
display_on = ["niri", "msg", "action", "power-on-monitors"]
suspend = ["systemctl", "suspend"]

[session]
# Opt in only when Vigil should own logind IdleHint (may activate logind IdleAction).
idle_hint_seconds = 0
